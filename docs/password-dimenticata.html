<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recupera l'accesso al tuo account GMBag.">
    <title>Password Dimenticata - GMBag</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
</head>
<body>
    <!-- HEADER E NAVIGAZIONE -->
    <header id="site-header">
        <nav class="navbar">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
                <a class="navbar-brand" href="index.html"><img src="assets/img/logo.jpg" alt="GM Bags" class="brand-logo" width="76" height="76">GM Bags</a>
                <ul class="navbar-nav">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="prodotti.html" class="nav-link">Prodotti</a></li>
                    <li><a href="blog.html" class="nav-link">Blog</a></li>
                    <li><a href="contatti.html" class="nav-link">Contatti</a></li>
                </ul>
                <button class="navbar-toggle" id="navbarToggle" aria-label="Apri/chiudi menu">&#9776;</button>
            </div>
        </nav>
    </header>

    <!-- HERO BANNER -->
    <section class="hero-banner hero-compact">
        <div class="inner-content">
            <h1>Password Dimenticata</h1>
            <p>Ti mandiamo un link via email per reimpostarla</p>
        </div>
    </section>

    <!-- SEZIONE -->
    <section class="products-section">
        <div class="container">
            <form class="contact-form fade-in" id="resetForm">
                <div class="form-group">
                    <label for="resetEmail">Email del tuo account *</label>
                    <input type="email" id="resetEmail" required>
                </div>
                <button type="submit" class="form-submit" id="resetSubmitBtn">Invia Link di Reset</button>
                <p class="form-status" id="resetStatus"></p>
                <p class="form-footnote"><a href="login.html">Torna al login</a></p>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 GMBag | Tutti i diritti riservati | <a href="privacy.html">Privacy Policy</a> | <a href="termini.html">Termini di Servizio</a></p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('resetStatus');
            const btn = document.getElementById('resetSubmitBtn');

            if (!isSupabaseConfigured) {
                statusEl.style.color = '#c62828';
                statusEl.textContent = 'Il sistema di account non è ancora attivo su questo sito.';
                return;
            }

            const email = document.getElementById('resetEmail').value.trim();
            btn.disabled = true;
            btn.textContent = 'Invio in corso...';
            statusEl.textContent = '';

            const redirectUrl = window.location.href.replace('password-dimenticata.html', 'reimposta-password.html');
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });

            btn.disabled = false;
            btn.textContent = 'Invia Link di Reset';

            // Per sicurezza mostriamo sempre lo stesso messaggio, anche se
            // l'email non esiste: cosi' nessuno puo' scoprire quali email
            // sono registrate sul sito provando a "resettarle".
            statusEl.style.color = '#2e7d32';
            statusEl.textContent = 'Se l\'indirizzo inserito corrisponde a un account, riceverai a breve una email con il link per reimpostare la password (controlla anche lo spam).';
            document.getElementById('resetForm').reset();
        });
    </script>
</body>
</html>
