<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog GM Bags.">
    <title>Articolo - GM Bags</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
    <style>
        .article-content {
            max-width: 760px;
            margin: 0 auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .article-image {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        .article-date {
            color: var(--accent-natural);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .article-title {
            margin-bottom: 1.5rem;
        }
        .article-body {
            line-height: 1.8;
            color: #333;
            font-size: 1.05rem;
        }
        .article-body p {
            margin-bottom: 1.2rem;
        }
        .article-back {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent-natural);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- HEADER E NAVIGAZIONE -->
    <header id="site-header">
        <nav class="navbar">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
                <a class="navbar-brand" href="index.html"><img src="assets/img/logo.jpg" alt="GM Bags" class="brand-logo" width="76" height="76">GM Bags</a>

                <ul class="navbar-nav">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="prodotti.html" class="nav-link">Prodotti</a></li>
                    <li><a href="blog.html" class="nav-link active">Blog</a></li>
                    <li><a href="contatti.html" class="nav-link">Contatti</a></li>
                </ul>
                <button class="navbar-toggle" id="navbarToggle" aria-label="Apri/chiudi menu">&#9776;</button>
            </div>
        </nav>
    </header>

    <!-- HERO BANNER -->
    <section class="hero-banner hero-compact">
        <div class="inner-content">
            <h1 id="articleHeroTitle">Articolo</h1>
        </div>
    </section>

    <!-- CONTENUTO -->
    <section class="products-section">
        <div class="container">
            <a href="blog.html" class="article-back">← Torna al Blog</a>
            <div class="article-content fade-in" id="articleContainer">
                <p>Caricamento...</p>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 GMBag | Tutti i diritti riservati | <a href="privacy.html">Privacy Policy</a></p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        (async () => {
            const container = document.getElementById('articleContainer');
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!isSupabaseConfigured || !slug) {
                container.innerHTML = '<p>Articolo non trovato. <a href="blog.html">Torna al blog</a>.</p>';
                return;
            }

            const { data: post, error } = await supabaseClient
                .from('blog_posts')
                .select('*')
                .eq('slug', slug)
                .eq('pubblicato', true)
                .single();

            if (error || !post) {
                container.innerHTML = '<p>Articolo non trovato. <a href="blog.html">Torna al blog</a>.</p>';
                return;
            }

            document.title = post.titolo + ' - GM Bags';
            document.getElementById('articleHeroTitle').textContent = post.titolo;

            const data = new Date(post.created_at).toLocaleDateString('it-IT', {
                day: 'numeric', month: 'long', year: 'numeric'
            });

            const paragrafi = post.contenuto
                .split(/\n\s*\n/)
                .map((p) => `<p>${escapeHtml(p.trim()).replace(/\n/g, '<br>')}</p>`)
                .join('');

            container.innerHTML = `
                ${post.immagine ? `<img class="article-image" src="${escapeHtml(post.immagine)}" alt="${escapeHtml(post.titolo)}">` : ''}
                <div class="article-date">${data}</div>
                <h2 class="article-title">${escapeHtml(post.titolo)}</h2>
                <div class="article-body">${paragrafi}</div>
            `;
        })();
    </script>
</body>
</html>
